<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Ahmed Gwely — AI Engineer: Generative AI, LLMs, AI Agents and Computer Vision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06FFA5"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#00D4FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="220" cy="120" rx="420" ry="300" fill="url(#glow1)"/>
  <ellipse cx="1000" cy="540" rx="420" ry="300" fill="url(#glow2)"/>

  <!-- Accent bar -->
  <rect x="80" y="96" width="72" height="6" rx="3" fill="url(#accent)"/>

  <!-- Eyebrow -->
  <text x="80" y="150" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" letter-spacing="6" fill="#00D4FF" fill-opacity="0.9">AI ENGINEER</text>

  <!-- Name -->
  <text x="76" y="288" font-family="'Syne', system-ui, sans-serif" font-size="96" font-weight="800" fill="#E2E8F0" letter-spacing="-2">Ahmed</text>
  <text x="76" y="392" font-family="'Syne', system-ui, sans-serif" font-size="96" font-weight="800" fill="url(#accent)" letter-spacing="-2">Gwely</text>

  <!-- Supporting line -->
  <text x="80" y="462" font-family="'DM Sans', system-ui, sans-serif" font-size="30" font-weight="600" fill="#94a3b8">Generative AI · LLMs · AI Agents · Computer Vision</text>

  <!-- Tagline -->
  <text x="80" y="512" font-family="'DM Sans', system-ui, sans-serif" font-size="21" fill="#64748b">Building practical AI systems end to end.</text>

  <!-- Divider -->
  <line x1="80" y1="548" x2="1120" y2="548" stroke="#00D4FF" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Links -->
  <text x="80" y="586" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" fill="#475569">github.com/AhmedGwely</text>
  <text x="430" y="586" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" fill="#475569">linkedin.com/in/ahmed-gwely</text>

  <!-- Corner brackets -->
  <path d="M 40 40 L 40 12 L 68 12" fill="none" stroke="#00D4FF" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M 1160 40 L 1160 12 L 1132 12" fill="none" stroke="#00D4FF" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M 40 590 L 40 618 L 68 618" fill="none" stroke="#00D4FF" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M 1160 590 L 1160 618 L 1132 618" fill="none" stroke="#00D4FF" stroke-opacity="0.35" stroke-width="2"/>
</svg>
